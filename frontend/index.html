<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17140f" />

    <!-- SEO -->
    <meta
      name="description"
      content="도심 속 프리미엄 호텔 '더 스테이' — 객실 실시간 예약, 다이닝·스파·수영장, 특가 패키지. 지금 바로 예약하세요."
    />
    <link rel="canonical" href="https://the-stay.example/" />

    <!-- Open Graph (카카오톡·페이스북·슬랙 링크 미리보기) -->
    <!-- 고정 URL(named tunnel) 확보 시 og:url·og:image 를 절대 URL 로 교체하면
         카카오톡 등 절대경로만 읽는 스크래퍼에서도 썸네일이 뜬다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="더 스테이" />
    <meta property="og:title" content="더 스테이 · 호텔 예약" />
    <meta
      property="og:description"
      content="도심 속 프리미엄 호텔 '더 스테이' — 객실 실시간 예약, 다이닝·스파·수영장, 특가 패키지."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://the-stay.example/" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="더 스테이 · 호텔 예약" />
    <meta
      name="twitter:description"
      content="도심 속 프리미엄 호텔 '더 스테이' — 객실 실시간 예약, 다이닝·스파·수영장, 특가 패키지."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>더 스테이 · 호텔 예약</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
