<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="ko">
<head>
    <title th:text="${editing} ? '요금정책 수정 · 호텔 PMS' : '요금정책 등록 · 호텔 PMS'">요금정책</title>
</head>
<body>
<main>
    <h1 class="h4 mb-4" th:text="${editing} ? '요금정책 수정' : '요금정책 등록'">요금정책 등록</h1>

    <form th:object="${form}" method="post"
          th:action="${editing}
                     ? @{/admin/basedata/rate-plans/{id}(id=${ratePlanId})}
                     : @{/admin/basedata/rate-plans}">

        <div class="card mb-3">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="roomTypeId" class="form-label">객실타입</label>
                        <select id="roomTypeId" class="form-select" th:field="*{roomTypeId}"
                                th:classappend="${#fields.hasErrors('roomTypeId')} ? 'is-invalid'">
                            <option value="">선택하세요</option>
                            <option th:each="rt : ${roomTypes}"
                                    th:value="${rt.id}"
                                    th:text="${rt.name} + ' (' + ${rt.code} + ')'"
                                    th:disabled="${!rt.active}">디럭스 더블 (DLX)</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{roomTypeId}">오류</div>
                    </div>

                    <div class="col-md-3">
                        <label for="code" class="form-label">코드</label>
                        <input type="text" id="code" class="form-control" th:field="*{code}"
                               th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                               th:readonly="${editing}" placeholder="BAR">
                        <div class="invalid-feedback" th:errors="*{code}">오류</div>
                        <div class="form-text" th:if="${editing}">코드는 수정할 수 없습니다.</div>
                    </div>

                    <div class="col-md-3">
                        <label for="name" class="form-label">정책명</label>
                        <input type="text" id="name" class="form-control" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="조식포함">
                        <div class="invalid-feedback" th:errors="*{name}">오류</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header bg-white fw-semibold small">요금</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="baseAmount" class="form-label">기본 요금</label>
                        <div class="input-group">
                            <span class="input-group-text">₩</span>
                            <input type="number" id="baseAmount" class="form-control"
                                   th:field="*{baseAmount}"
                                   th:classappend="${#fields.hasErrors('baseAmount')} ? 'is-invalid'"
                                   min="0" step="100">
                            <div class="invalid-feedback" th:errors="*{baseAmount}">오류</div>
                        </div>
                        <div class="form-text">해당 일자에 요금 캘린더 값이 없을 때 쓰입니다.</div>
                    </div>

                    <div class="col-md-4 d-flex align-items-center">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" id="breakfastIncluded"
                                   th:field="*{breakfastIncluded}">
                            <label class="form-check-label" for="breakfastIncluded">조식 포함</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header bg-white fw-semibold small">취소 정책</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="refundable"
                                   th:field="*{refundable}">
                            <label class="form-check-label" for="refundable">환불 가능</label>
                        </div>
                        <div class="form-text">
                            끄면 환불 불가 정책이 됩니다. 아래 두 항목은 환불 가능일 때만 의미가 있습니다.
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="cancelDeadlineDays" class="form-label">무료 취소 기한</label>
                        <div class="input-group">
                            <input type="number" id="cancelDeadlineDays" class="form-control"
                                   th:field="*{cancelDeadlineDays}"
                                   th:classappend="${#fields.hasErrors('cancelDeadlineDays')} ? 'is-invalid'"
                                   min="0" max="365">
                            <span class="input-group-text">일 전까지</span>
                            <div class="invalid-feedback" th:errors="*{cancelDeadlineDays}">오류</div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="penaltyRate" class="form-label">기한 후 위약금율</label>
                        <div class="input-group">
                            <input type="number" id="penaltyRate" class="form-control"
                                   th:field="*{penaltyRate}"
                                   th:classappend="${#fields.hasErrors('penaltyRate')} ? 'is-invalid'"
                                   min="0" max="100" step="0.01">
                            <span class="input-group-text">%</span>
                            <div class="invalid-feedback" th:errors="*{penaltyRate}">오류</div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active"
                                   th:field="*{active}">
                            <label class="form-check-label" for="active">판매중</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit"
                    th:text="${editing} ? '저장' : '등록'">등록</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/basedata/rate-plans}">취소</a>
        </div>
    </form>
</main>
</body>
</html>
