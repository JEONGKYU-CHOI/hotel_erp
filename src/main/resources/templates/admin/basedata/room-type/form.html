<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="ko">
<head>
    <title th:text="${editing} ? '객실타입 수정 · 호텔 PMS' : '객실타입 등록 · 호텔 PMS'">객실타입</title>
</head>
<body>
<main>
    <h1 class="h4 mb-4" th:text="${editing} ? '객실타입 수정' : '객실타입 등록'">객실타입 등록</h1>

    <!--
      th:object 로 폼 객체를 지정하면 아래에서 *{필드명} 으로 짧게 쓸 수 있고,
      th:errors 가 해당 필드의 검증 실패 메시지를 자동으로 찾아 준다.
      등록과 수정이 보내는 곳만 다르고 항목은 같아서 화면 하나로 겸한다.
    -->
    <form th:object="${form}" method="post" enctype="multipart/form-data"
          th:action="${editing}
                     ? @{/admin/basedata/room-types/{id}(id=${roomTypeId})}
                     : @{/admin/basedata/room-types}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류</div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="code" class="form-label">코드</label>
                        <input type="text" id="code" class="form-control" th:field="*{code}"
                               th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                               th:readonly="${editing}" placeholder="DLX">
                        <div class="invalid-feedback" th:errors="*{code}">오류</div>
                        <div class="form-text" th:if="${editing}">
                            코드는 다른 데이터가 참조하는 식별자라 수정할 수 없습니다.
                        </div>
                    </div>
                    <div class="col-md-8">
                        <label for="name" class="form-label">표시명</label>
                        <input type="text" id="name" class="form-control" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="디럭스 더블">
                        <div class="invalid-feedback" th:errors="*{name}">오류</div>
                    </div>
                    <div class="col-md-8">
                        <label for="nameEn" class="form-label">영문 표시명 <span class="text-muted small">(선택)</span></label>
                        <input type="text" id="nameEn" class="form-control" th:field="*{nameEn}"
                               th:classappend="${#fields.hasErrors('nameEn')} ? 'is-invalid'"
                               placeholder="Deluxe Double">
                        <div class="form-text">비우면 부킹엔진 영어 모드에서 한글 표시명으로 노출됩니다.</div>
                        <div class="invalid-feedback" th:errors="*{nameEn}">오류</div>
                    </div>

                    <div class="col-12">
                        <label for="description" class="form-label">설명</label>
                        <textarea id="description" class="form-control" rows="3"
                                  th:field="*{description}"
                                  placeholder="부킹엔진에 노출되는 소개 문구"></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label mb-1">객실 이미지 <span class="text-muted small">(최대 3장 · 첫 장이 대표)</span></label>
                        <div class="form-text mt-0 mb-2">부킹엔진 객실 갤러리에서 좌우 버튼으로 넘겨 봅니다. JPG·PNG·WEBP·GIF, 장당 5MB 이하.</div>
                        <div class="row g-3">
                            <!-- 이미지 슬롯 1 -->
                            <div class="col-md-4">
                                <div class="border rounded p-2 h-100">
                                    <div class="small text-muted mb-1">이미지 1 (대표)</div>
                                    <img th:if="*{imageUrl}" th:src="*{imageUrl}" alt="이미지 1 미리보기"
                                         class="img-fluid rounded mb-2" style="max-height:120px;object-fit:cover;width:100%">
                                    <input type="hidden" th:field="*{imageUrl}">
                                    <input type="file" accept="image/*" class="form-control form-control-sm"
                                           th:field="*{image1File}"
                                           th:classappend="${#fields.hasErrors('image1File')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{image1File}">오류</div>
                                    <div class="form-check mt-1" th:if="*{imageUrl}">
                                        <input class="form-check-input" type="checkbox" id="removeImage1" th:field="*{removeImage1}">
                                        <label class="form-check-label small" for="removeImage1">이 이미지 삭제</label>
                                    </div>
                                </div>
                            </div>
                            <!-- 이미지 슬롯 2 -->
                            <div class="col-md-4">
                                <div class="border rounded p-2 h-100">
                                    <div class="small text-muted mb-1">이미지 2</div>
                                    <img th:if="*{imageUrl2}" th:src="*{imageUrl2}" alt="이미지 2 미리보기"
                                         class="img-fluid rounded mb-2" style="max-height:120px;object-fit:cover;width:100%">
                                    <input type="hidden" th:field="*{imageUrl2}">
                                    <input type="file" accept="image/*" class="form-control form-control-sm"
                                           th:field="*{image2File}"
                                           th:classappend="${#fields.hasErrors('image2File')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{image2File}">오류</div>
                                    <div class="form-check mt-1" th:if="*{imageUrl2}">
                                        <input class="form-check-input" type="checkbox" id="removeImage2" th:field="*{removeImage2}">
                                        <label class="form-check-label small" for="removeImage2">이 이미지 삭제</label>
                                    </div>
                                </div>
                            </div>
                            <!-- 이미지 슬롯 3 -->
                            <div class="col-md-4">
                                <div class="border rounded p-2 h-100">
                                    <div class="small text-muted mb-1">이미지 3</div>
                                    <img th:if="*{imageUrl3}" th:src="*{imageUrl3}" alt="이미지 3 미리보기"
                                         class="img-fluid rounded mb-2" style="max-height:120px;object-fit:cover;width:100%">
                                    <input type="hidden" th:field="*{imageUrl3}">
                                    <input type="file" accept="image/*" class="form-control form-control-sm"
                                           th:field="*{image3File}"
                                           th:classappend="${#fields.hasErrors('image3File')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{image3File}">오류</div>
                                    <div class="form-check mt-1" th:if="*{imageUrl3}">
                                        <input class="form-check-input" type="checkbox" id="removeImage3" th:field="*{removeImage3}">
                                        <label class="form-check-label small" for="removeImage3">이 이미지 삭제</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="standardOccupancy" class="form-label">기준 인원</label>
                        <input type="number" id="standardOccupancy" class="form-control"
                               th:field="*{standardOccupancy}"
                               th:classappend="${#fields.hasErrors('standardOccupancy')} ? 'is-invalid'"
                               min="1" max="99">
                        <div class="invalid-feedback" th:errors="*{standardOccupancy}">오류</div>
                    </div>
                    <div class="col-md-3">
                        <label for="maxOccupancy" class="form-label">최대 인원</label>
                        <input type="number" id="maxOccupancy" class="form-control"
                               th:field="*{maxOccupancy}"
                               th:classappend="${#fields.hasErrors('maxOccupancy')} ? 'is-invalid'"
                               min="1" max="99">
                        <div class="invalid-feedback" th:errors="*{maxOccupancy}">오류</div>
                    </div>
                    <div class="col-md-3">
                        <label for="bedType" class="form-label">베드 타입</label>
                        <input type="text" id="bedType" class="form-control" th:field="*{bedType}"
                               placeholder="DOUBLE / TWIN / KING">
                    </div>
                    <div class="col-md-3">
                        <label for="displayOrder" class="form-label">노출 순서</label>
                        <input type="number" id="displayOrder" class="form-control"
                               th:field="*{displayOrder}"
                               th:classappend="${#fields.hasErrors('displayOrder')} ? 'is-invalid'"
                               min="0">
                        <div class="invalid-feedback" th:errors="*{displayOrder}">오류</div>
                    </div>

                    <!--
                      항목 간 관계 검증(@AssertTrue)의 오류는 메서드 이름에서 딴
                      프로퍼티에 붙는다. isOccupancyConsistent() -> 'occupancyConsistent'.
                      화면에 없는 이름이라 여기서 명시적으로 그려주지 않으면, 저장이
                      거부됐는데 아무 설명 없이 폼만 되돌아온다. 실제로 그렇게 만들었다가
                      검증에서 발견했다.
                    -->
                    <div class="col-12" th:if="${#fields.hasErrors('occupancyConsistent')}">
                        <div class="alert alert-danger py-2 mb-0 small"
                             th:errors="*{occupancyConsistent}">오류</div>
                    </div>

                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active"
                                   th:field="*{active}">
                            <label class="form-check-label" for="active">판매중</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit"
                    th:text="${editing} ? '저장' : '등록'">등록</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/basedata/room-types}">취소</a>
        </div>
    </form>
</main>
</body>
</html>
