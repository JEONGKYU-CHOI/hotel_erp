<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="ko">
<head>
    <title>객실타입 · 호텔 PMS</title>
</head>
<body>
<main>
    <div class="d-flex align-items-center mb-4">
        <div>
            <h1 class="h4 mb-1">객실타입</h1>
            <p class="text-secondary small mb-0">판매 단위입니다. 고객은 호실이 아니라 이 타입을 예약합니다.</p>
        </div>
        <a class="btn btn-primary ms-auto" th:href="@{/admin/basedata/room-types/new}">등록</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width:5rem;">순서</th>
                    <th style="width:8rem;">코드</th>
                    <th>표시명</th>
                    <th style="width:8rem;">인원</th>
                    <th style="width:7rem;">베드</th>
                    <th style="width:7rem;">상태</th>
                    <th style="width:12rem;"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rt : ${roomTypes}">
                    <td class="text-secondary" th:text="${rt.displayOrder}">0</td>
                    <td><code th:text="${rt.code}">DLX</code></td>
                    <td>
                        <div th:text="${rt.name}">디럭스 더블</div>
                        <div class="small text-secondary text-truncate" style="max-width:32rem;"
                             th:if="${rt.description}" th:text="${rt.description}"></div>
                    </td>
                    <td class="small">
                        기준 <span th:text="${rt.standardOccupancy}">2</span> /
                        최대 <span th:text="${rt.maxOccupancy}">2</span>
                    </td>
                    <td class="small text-secondary" th:text="${rt.bedType} ?: '-'">-</td>
                    <td>
                        <span class="badge" th:classappend="${rt.active} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${rt.active} ? '판매중' : '중단'">판매중</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/admin/basedata/room-types/{id}/edit(id=${rt.id})}">수정</a>
                        <!-- 상태 변경은 POST. GET 링크로 두면 CSRF 방어를 받지 못한다. -->
                        <form class="d-inline"
                              th:action="@{/admin/basedata/room-types/{id}/toggle-active(id=${rt.id})}"
                              method="post">
                            <button class="btn btn-sm"
                                    th:classappend="${rt.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                    th:text="${rt.active} ? '판매중단' : '판매재개'"
                                    type="submit">판매중단</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(roomTypes)}">
                    <td colspan="7" class="text-center text-secondary py-5">
                        등록된 객실타입이 없습니다. 오른쪽 위 <b>등록</b> 버튼으로 시작하세요.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="small text-secondary mt-3 mb-0">
        객실타입은 삭제하지 않고 <b>판매중단</b>으로 처리합니다.
        호실·요금정책·재고·예약이 이 타입을 참조하고 있어, 지우면 과거 예약이 어떤 객실이었는지 알 수 없게 됩니다.
    </p>
</main>
</body>
</html>
