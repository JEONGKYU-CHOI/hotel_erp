<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="ko">
<head>
    <title>추천 메일 미리보기 · 호텔 PMS</title>
</head>
<body>
<main>
    <div class="d-flex align-items-center mb-4">
        <div>
            <h1 class="h4 page-title mb-1">추천 메일 미리보기</h1>
            <p class="text-secondary small mb-0">
                대상 월 <strong th:text="${currentMonth}">2026-08</strong> ·
                발송하지 않고 대상 회원별 메일 내용만 미리 봅니다.
            </p>
        </div>
        <a class="btn btn-outline-secondary btn-sm ms-auto" th:href="@{/admin/marketing}">
            <i class="bi bi-arrow-left me-1"></i> 발송 화면
        </a>
    </div>

    <div th:if="${previews.isEmpty()}" class="alert alert-secondary">
        이번 달 발송 대상 회원이 없습니다. (수신동의 + 성별·생년월일 + 최근 3개월 체크아웃 이력 필요)
    </div>

    <div th:each="p : ${previews}" class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="d-flex align-items-center mb-2">
                <span class="badge text-bg-light border me-2"><i class="bi bi-person me-1"></i>
                    <span th:text="${p.to}">reco@stay.test</span></span>
                <strong class="small" th:text="${p.subject}">제목</strong>
            </div>
            <pre class="mb-0 p-3 rounded bg-body-tertiary small"
                 style="white-space:pre-wrap;word-break:break-word;font-family:inherit"
                 th:text="${p.body}">본문</pre>
        </div>
    </div>
</main>
</body>
</html>
