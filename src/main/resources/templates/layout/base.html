<!DOCTYPE html>
<!--
  백오피스 공통 레이아웃.

  레이아웃 방언(thymeleaf-layout-dialect)을 추가하지 않고 Thymeleaf 표준 기능인
  fragment 파라미터로 처리한다. 의존성 하나를 줄이는 것이 목적이다.

  각 페이지는 이렇게 쓴다.
      <html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
      <head><title>제목</title></head>
      <body><main> ... </main></body>
      </html>

  ~{::title} 은 "이 문서의 <title> 태그"라는 뜻이고, 그것을 아래 layout 의
  title 자리에 끼워 넣는다.
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, main)"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">호텔 PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background-color: #f6f7f9; }
        .sidebar { min-height: calc(100vh - 56px); background: #fff; border-right: 1px solid #dee2e6; }
        .sidebar .nav-link { color: #495057; border-radius: .375rem; }
        .sidebar .nav-link:hover { background: #f1f3f5; }
        .sidebar .nav-link.active { background: #0d6efd; color: #fff; }
        .section-label { font-size: .75rem; letter-spacing: .04em; color: #868e96; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" th:href="@{/admin}">호텔 PMS</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white-50 small" sec:authentication="name">사용자</span>
            <!-- 로그아웃은 POST 다. GET 이면 링크를 심어둔 이미지 하나로 남의 세션을
                 끊을 수 있다. th:action 이 CSRF 토큰을 자동으로 넣어 준다. -->
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-sm btn-outline-light" type="submit">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <aside class="col-12 col-md-3 col-lg-2 sidebar p-3">
            <div class="section-label text-uppercase mb-2">기준정보</div>
            <ul class="nav nav-pills flex-column mb-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/basedata/room-types}">객실타입</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/basedata/rooms}">호실</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/basedata/rate-plans}">요금정책</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/basedata/rate-calendar}">요금 캘린더</a>
                </li>
            </ul>
            <div class="section-label text-uppercase mb-2">운영</div>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/reservations}">예약</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/housekeeping}">하우스키핑</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/inventory}">재고</a></li>
                <li class="nav-item"><a class="nav-link disabled" href="#">야간마감</a></li>
            </ul>
        </aside>

        <div class="col-12 col-md-9 col-lg-10 py-4">
            <!-- 리다이렉트 후 1회만 보여줄 알림. RedirectAttributes 가 실어 보낸다. -->
            <div th:if="${flashSuccess}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${flashSuccess}">완료</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${flashError}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${flashError}">오류</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <main th:replace="${main}">
                <p>본문</p>
            </main>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
