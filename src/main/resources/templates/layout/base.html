<!DOCTYPE html>
<!--
  백오피스 공통 레이아웃 (대시보드 셸).

  레이아웃 방언(thymeleaf-layout-dialect) 없이 Thymeleaf 표준 fragment 파라미터로 처리한다.
  각 페이지: <html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, main)"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">호텔 PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bo-sidebar: #1c2130;
            --bo-sidebar-2: #171b28;
            --bo-accent: #6366f1;
            --bo-ink: #1f2430;
            --bo-muted: #6b7280;
            --bo-bg: #f4f5f7;
            --bo-border: #e6e8ec;
        }
        body { background: var(--bo-bg); color: var(--bo-ink); }

        .bo-layout { display: flex; min-height: 100vh; }

        /* 사이드바 */
        .bo-sidebar {
            width: 232px; flex-shrink: 0;
            background: var(--bo-sidebar);
            color: #c7ccd6;
            display: flex; flex-direction: column;
            position: sticky; top: 0; height: 100vh;
        }
        .bo-brand {
            display: flex; align-items: center; gap: 10px;
            padding: 20px 22px; font-weight: 600; font-size: 1.1rem; color: #fff;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .bo-brand i { color: var(--bo-accent); font-size: 1.3rem; }
        .bo-nav { padding: 16px 12px; overflow-y: auto; }
        .bo-section { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
            color: #6b7280; margin: 14px 10px 6px; }
        .bo-nav a {
            display: flex; align-items: center; gap: 11px;
            padding: 9px 12px; margin-bottom: 2px; border-radius: 9px;
            color: #c7ccd6; text-decoration: none; font-size: .9rem; font-weight: 500;
            transition: background .15s, color .15s;
        }
        .bo-nav a i { font-size: 1.05rem; width: 20px; text-align: center; color: #8b93a3; }
        .bo-nav a:hover { background: rgba(255,255,255,.05); color: #fff; }
        .bo-nav a:hover i { color: #c7ccd6; }
        .bo-nav a.active { background: var(--bo-accent); color: #fff; }
        .bo-nav a.active i { color: #fff; }
        .bo-nav a.disabled { opacity: .4; pointer-events: none; }

        /* 본문 영역 */
        .bo-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .bo-topbar {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 28px; background: #fff; border-bottom: 1px solid var(--bo-border);
            position: sticky; top: 0; z-index: 20;
        }
        .bo-topbar .who { margin-left: auto; color: var(--bo-muted); font-size: .88rem; }
        .bo-content { padding: 26px 28px 48px; }

        /* 카드·통계 */
        .card { border: 1px solid var(--bo-border); border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
        .stat-card { border: 1px solid var(--bo-border); border-radius: 14px; background: #fff; padding: 18px 20px; height: 100%; }
        .stat-card .stat-ico { width: 42px; height: 42px; border-radius: 11px; display: inline-flex;
            align-items: center; justify-content: center; font-size: 1.25rem; }
        .stat-card .stat-val { font-size: 1.9rem; font-weight: 700; line-height: 1.1; color: var(--bo-ink); }
        .stat-card .stat-lbl { color: var(--bo-muted); font-size: .82rem; }
        .tint-indigo { background: #eef2ff; color: #4f46e5; }
        .tint-green  { background: #e9f7ef; color: #1d8a4e; }
        .tint-amber  { background: #fef4e6; color: #b9791b; }
        .tint-blue   { background: #e8f1fd; color: #2570c4; }
        .tint-rose   { background: #fdecec; color: #c23b34; }
        .tint-slate  { background: #eef0f3; color: #4b5563; }

        .page-title { font-weight: 600; letter-spacing: -.01em; }
        .table > :not(caption) > * > * { padding: .7rem .75rem; }

        .bo-menu-toggle { display: none; }
        .bo-backdrop { display: none; }
        @media (max-width: 1199px) and (min-width: 768px) {
            .bo-sidebar { width: 76px; }
            .bo-brand { justify-content: center; padding-inline: 10px; font-size: 0; }
            .bo-brand i { font-size: 1.35rem; }
            .bo-section { display: none; }
            .bo-nav { padding-inline: 10px; }
            .bo-nav a { justify-content: center; font-size: 0; padding: 12px 8px; }
            .bo-nav a i { width: auto; font-size: 1.2rem; }
            .bo-content { padding: 22px 20px 42px; }
        }
        @media (max-width: 767px) {
            .bo-sidebar { position: fixed; z-index: 1050; left: 0; top: 0; width: min(280px, 86vw); transform: translateX(-105%); transition: transform .2s ease; }
            body.bo-nav-open .bo-sidebar { transform: translateX(0); }
            .bo-backdrop { position: fixed; inset: 0; z-index: 1040; border: 0; background: rgba(15,18,24,.48); }
            body.bo-nav-open .bo-backdrop { display: block; }
            .bo-menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
            .bo-topbar { padding: 10px 14px; }
            .bo-topbar .who { margin-left: 0; }
            .bo-content { padding: 18px 12px 36px; overflow-x: hidden; }
            .bo-content .row { --bs-gutter-x: .75rem; }
            .bo-content .table-responsive, .bo-content .card { max-width: 100%; }
            .bo-content table { min-width: 680px; }
            .bo-content .card-body { padding: 1rem; }
            .bo-content form .row > [class*="col-"] { width: 100%; }
            .page-title { font-size: 1.25rem; }
        }
    </style>
</head>
<body>
<div class="bo-layout">
    <aside class="bo-sidebar">
        <div class="bo-brand"><i class="bi bi-buildings"></i> 호텔 PMS</div>
        <nav class="bo-nav">
            <a th:href="@{/admin}"><i class="bi bi-speedometer2"></i> 대시보드</a>

            <div class="bo-section">운영</div>
            <a th:href="@{/admin/reservations}"><i class="bi bi-journal-text"></i> 예약</a>
            <a th:href="@{/admin/housekeeping}"><i class="bi bi-stars"></i> 하우스키핑</a>
            <a th:href="@{/admin/inventory}"><i class="bi bi-box-seam"></i> 재고</a>
            <a th:href="@{/admin/marketing}"><i class="bi bi-envelope-heart"></i> 추천 메일</a>
            <a class="disabled" href="#"><i class="bi bi-moon-stars"></i> 야간마감</a>

            <div class="bo-section">기준정보</div>
            <a th:href="@{/admin/basedata/room-types}"><i class="bi bi-door-closed"></i> 객실타입</a>
            <a th:href="@{/admin/basedata/rooms}"><i class="bi bi-key"></i> 호실</a>
            <a th:href="@{/admin/basedata/rate-plans}"><i class="bi bi-tag"></i> 요금정책</a>
            <a th:href="@{/admin/basedata/rate-calendar}"><i class="bi bi-calendar3"></i> 요금 캘린더</a>
            <a th:href="@{/admin/basedata/booking-policy}"><i class="bi bi-clock-history"></i> 예약 정책</a>
        </nav>
    </aside>
    <button class="bo-backdrop" type="button" aria-label="메뉴 닫기"></button>

    <div class="bo-main">
        <header class="bo-topbar">
            <button class="btn btn-sm btn-outline-secondary bo-menu-toggle" type="button"
                    aria-label="관리 메뉴 열기" aria-expanded="false" aria-controls="bo-sidebar">
                <i class="bi bi-list"></i>
            </button>
            <span class="who"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name">사용자</span></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-sm btn-outline-secondary" type="submit">로그아웃</button>
            </form>
        </header>

        <div class="bo-content">
            <div th:if="${flashSuccess}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${flashSuccess}">완료</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${flashError}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${flashError}">오류</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <main th:replace="${main}">
                <p>본문</p>
            </main>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 현재 경로에 맞는 사이드바 링크를 활성화한다. 가장 길게 매칭되는 링크 하나만.
    (function () {
        var path = location.pathname;
        var links = Array.prototype.slice.call(document.querySelectorAll('.bo-nav a[href]'));
        var best = null;
        links.forEach(function (a) {
            // 태블릿 아이콘 레일에서는 텍스트가 시각적으로 숨으므로 기본 툴팁을 제공한다.
            if (!a.title) a.title = a.textContent.trim();
            var href = a.getAttribute('href');
            if (href === '#') return;
            var match = href === '/admin' ? path === '/admin' : path.indexOf(href) === 0;
            if (match && (!best || href.length > best.getAttribute('href').length)) best = a;
        });
        if (best) best.classList.add('active');
    })();

    // 모바일 PMS 사이드바. 태블릿은 아이콘 레일, 모바일은 오프캔버스로 동작한다.
    (function () {
        var toggle = document.querySelector('.bo-menu-toggle');
        var backdrop = document.querySelector('.bo-backdrop');
        var sidebar = document.querySelector('.bo-sidebar');
        if (!toggle || !sidebar) return;
        sidebar.id = 'bo-sidebar';
        function setOpen(open) {
            document.body.classList.toggle('bo-nav-open', open);
            toggle.setAttribute('aria-expanded', String(open));
        }
        toggle.addEventListener('click', function () { setOpen(!document.body.classList.contains('bo-nav-open')); });
        backdrop.addEventListener('click', function () { setOpen(false); });
        sidebar.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
</script>
</body>
</html>
