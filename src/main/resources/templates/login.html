<!DOCTYPE html>
<!--
  백오피스 로그인.

  공통 레이아웃(layout/base.html)을 쓰지 않는다. 그 레이아웃에는 사이드바와
  로그아웃 버튼처럼 "이미 로그인한 사람"을 전제한 요소가 들어 있다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 · 호텔 PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container" style="max-width: 380px;">
    <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
            <h1 class="h5 mb-1">호텔 PMS</h1>
            <p class="text-secondary small mb-4">백오피스 로그인</p>

            <!-- 실패 사유를 '아이디 없음' 과 '비밀번호 틀림' 으로 나누어 보여주지 않는다.
                 구분되면 공격자가 유효한 아이디 목록을 수집할 수 있다. -->
            <div th:if="${param.error}" class="alert alert-danger py-2 small">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.logout}" class="alert alert-secondary py-2 small">
                로그아웃되었습니다.
            </div>

            <!-- th:action 을 쓰면 Thymeleaf 가 CSRF 히든 필드를 자동으로 넣는다.
                 순수 action="/login" 으로 쓰면 토큰이 빠져 403 이 난다. -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label small">아이디</label>
                    <input type="text" id="username" name="username"
                           class="form-control" autocomplete="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small">비밀번호</label>
                    <input type="password" id="password" name="password"
                           class="form-control" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">로그인</button>
            </form>
        </div>
    </div>
    <p class="text-center text-secondary small mt-3">
        고객 예약은 <a th:href="@{/}">부킹엔진</a>에서 이용해 주세요.
    </p>
</div>

</body>
</html>
