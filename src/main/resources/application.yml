spring:
  application:
    name: hotel-erp

  # 파일 업로드(객실 이미지) 용량 제한. 넘치면 413 로 막아 디스크·메모리를 지킨다.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  # ---------------------------------------------------------------------------
  # DataSource
  # 비밀번호는 절대 파일에 쓰지 않는다. 환경변수 DB_PASSWORD 로 주입한다.
  #   allowPublicKeyRetrieval : MySQL 8.4 기본 인증(caching_sha2_password)을
  #                             비SSL 로컬 연결에서 쓰기 위해 필요
  #   connectionTimeZone=SERVER
  #     서버에 설정된 시간대(+09:00)를 그대로 따른다.
  #     'Asia/Seoul' 같은 *이름*을 쓰면 안 된다. Windows MySQL 은 타임존 이름
  #     테이블(mysql.time_zone_name)을 기본 적재하지 않아 이름을 해석하지 못하고
  #     ER_UNKNOWN_TIME_ZONE_ERROR(1298) 로 커넥션 획득이 실패한다.
  #     서버 my.ini 의 default-time-zone 이 '+09:00' 오프셋이므로 SERVER 로 충분하다.
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/hotel_erp?characterEncoding=UTF-8&connectionTimeZone=SERVER&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: hotel-erp-pool
      maximum-pool-size: 20
      # 재고 락 대기가 길어지면 커넥션이 고갈된다. 대기 시간을 짧게 잡아
      # 문제를 조용한 지연이 아니라 명시적 예외로 드러낸다.
      connection-timeout: 3000

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  #   ddl-auto: validate  -> 스키마는 Flyway 가 만든다(D-005).
  #                          엔티티와 실제 테이블이 어긋나면 시동을 실패시켜
  #                          매핑 실수를 조용히 넘기지 않는다.
  #   open-in-view: false -> 뷰 렌더링까지 영속성 컨텍스트를 열어두면
  #                          커넥션을 오래 붙잡아 락 경합이 커진다.
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          time_zone: Asia/Seoul
          # 배치 insert/update 묶음 처리. 야간마감에서 유효하다.
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true

  # ---------------------------------------------------------------------------
  # Flyway (D-005)
  # 마이그레이션 SQL 이 스키마의 유일한 진실이다. GUI 로 테이블을 고치지 말 것.
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  thymeleaf:
    cache: false          # 개발 중 템플릿 즉시 반영
    prefix: classpath:/templates/
    suffix: .html

  # 개발 편의: 정적 리소스/템플릿 변경 시 자동 재시작
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# -----------------------------------------------------------------------------
# 애플리케이션 설정 (커스텀)
#   jwt.secret : HS256 서명 키. 운영은 반드시 환경변수 JWT_SECRET 로 주입한다.
#                기본값은 개발/테스트 전용이며 최소 256bit(32바이트) 이상이어야 한다.
#   jwt.access-token-validity : Access Token 수명. 리프레시 토큰은 두지 않는다(D-010).
#
#   toss.secret-key : 토스페이먼츠 시크릿 키. 서버가 승인 API 호출·웹훅 검증에 쓴다.
#                     ★ 절대 파일/커밋에 실제 값을 쓰지 않는다. 환경변수 TOSS_SECRET_KEY 로
#                     주입한다(JWT 규율과 동일). 미주입 시 아래 더미값으로 부팅은 되지만
#                     실제 승인 호출은 실패한다(통합테스트는 토스 API 를 mock 하므로 무관).
#   toss.client-key : 프론트(결제창)용 공개 키. 백엔드는 쓰지 않으나 React 단계에서
#                     내려주려고 여기 둔다. 환경변수 TOSS_CLIENT_KEY.
#   toss.base-url   : 토스 결제 API 베이스. 승인 엔드포인트는 /v1/payments/confirm.
# -----------------------------------------------------------------------------
app:
  # 업로드 파일(객실 이미지) 저장 디렉터리. 로컬은 프로젝트 하위 uploads/, 배포는
  # 볼륨을 마운트한 절대경로(APP_UPLOAD_DIR=/app/uploads)를 준다. 서빙 경로는 /uploads/**.
  # 추후 오브젝트 스토리지(R2/S3)로 옮길 땐 이 저장부만 교체한다(D-053).
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  # 추천 메일(4단계) 하단 수신거부 링크의 절대 URL 베이스. 메일은 브라우저 밖에서 열리므로
  # 상대경로가 통하지 않는다. 로컬은 localhost, 배포는 공개 도메인(APP_PUBLIC_BASE_URL)을 준다.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  # 추천 메일 문구 생성(3단계) — Gemini.
  #   api-key : ★ 실제 키는 여기(커밋되는 파일)에 쓰지 않는다. 환경변수 GEMINI_API_KEY 또는
  #             application-local.yml(gitignore)에 넣는다. 비어 있으면 실호출 없이 템플릿 문구로
  #             폴백하므로, 키가 없어도 발송 파이프라인은 그대로 돈다(토스 키와 같은 규율).
  #   model   : 사용할 모델. 계정에서 쓸 수 있는 모델로 GEMINI_MODEL 로 바꿀 수 있다.
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-hotel-erp-booking-engine-jwt-hs256-key}
    access-token-validity: PT1H
  toss:
    secret-key: ${TOSS_SECRET_KEY:test_sk_dummy-set-real-key-via-env}
    client-key: ${TOSS_CLIENT_KEY:test_ck_dummy-set-real-key-via-env}
    base-url: https://api.tosspayments.com

server:
  port: 8080
  # 요청 본문을 UTF-8 로 강제한다. force=true 여야 멀티파트(파일 업로드) 폼의 한글
  # 텍스트 필드까지 UTF-8 로 디코딩된다 — 없으면 객실명 등 한글이 깨져 저장될 수 있다.
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: always
    include-binding-errors: always

# -----------------------------------------------------------------------------
# Logging
# JPA 를 처음 쓰는 상황에서 "내 코드가 어떤 SQL 을 언제 날렸는가"는
# 반드시 눈에 보여야 한다. 특히 @Lock 이 실제로 FOR UPDATE 를 내보내는지.
#   org.hibernate.SQL          : 실행된 SQL
#   org.hibernate.orm.jdbc.bind: 바인딩된 파라미터 실제 값
# -----------------------------------------------------------------------------
logging:
  level:
    root: INFO
    io.github.jeongkyuchoi.hotel.erp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.transaction.interceptor: TRACE
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
