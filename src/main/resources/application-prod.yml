# =============================================================================
# 운영/배포 프로파일 (prod)
#   docker compose / 터널 노출용. application.yml(개발 기본값)을 덮어쓴다.
#
#   - 로깅: DEBUG/TRACE SQL 을 끈다(성능·정보노출). INFO 기준.
#   - Thymeleaf 캐시: 켠다(운영은 템플릿이 안 바뀐다).
#   - DataSource URL: 환경변수 DB_URL 로 주입(도커에선 mysql 서비스명). 비번은 DB_PASSWORD.
#   - 관리자 시드: ProdAdminSeeder 가 ADMIN_INIT_* 를 읽는다.
#   비밀값(DB_PASSWORD·JWT_SECRET·TOSS_*·ADMIN_INIT_PASSWORD)은 여기 쓰지 않고 환경변수로.
# =============================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/hotel_erp?characterEncoding=UTF-8&connectionTimeZone=SERVER&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}

  thymeleaf:
    cache: true

  # devtools 는 repackage 된 jar 에서 제외되지만, 방어적으로 끈다.
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

# 운영 관리자 시드(ProdAdminSeeder)가 읽는 값. 비밀번호가 없으면 계정을 만들지 않는다.
app:
  admin:
    username: ${ADMIN_INIT_USERNAME:admin}
    password: ${ADMIN_INIT_PASSWORD:}
    name: ${ADMIN_INIT_NAME:관리자}

logging:
  level:
    root: INFO
    io.github.jeongkyuchoi.hotel.erp: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.transaction.interceptor: WARN
    org.flywaydb: INFO

management:
  endpoint:
    health:
      show-details: never
